<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projet</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1f;--card:rgba(255,255,255,.05);--ink:#eef1fa;--muted:#98a2bf;--line:rgba(255,255,255,.1);--acc:#7aa2ff;--gold:#e8b64c}
[data-theme=light]{--bg:#f6f7fb;--card:#fff;--ink:#121833;--muted:#5b6585;--line:#dde2f0;--acc:#2447c9;--gold:#b87d0b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
.top{background:var(--bg);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.back{color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;border:1px solid var(--line);padding:7px 14px;border-radius:999px}
.back:hover{color:var(--ink);border-color:var(--acc)}
.ttl{font-family:Fraunces,Georgia,serif;font-size:17px;flex:1;min-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{font-family:Inter,sans-serif;color:var(--gold);font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;font-weight:600;margin-right:12px}
.tabs{display:flex;gap:4px;background:var(--card);padding:3px;border-radius:999px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;color:var(--muted);padding:7px 18px;border-radius:999px;font:500 14px Inter,sans-serif;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg)}
.dl{font-size:13.5px;text-decoration:none;color:var(--ink);border:1px solid var(--line);padding:8px 16px;border-radius:999px;font-weight:500}
.dl:hover{border-color:var(--acc)}
iframe{flex:1;width:100%;border:0;background:#fff}
.msg{padding:60px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="top">
  <a class="back" href="index.html">← Portfolio</a>
  <div class="ttl" id="ttl"></div>
  <div class="tabs"><button id="t-rep" class="on">Rapport</button><button id="t-nb">Notebook</button></div>
  <a class="dl" id="dl" download>⬇ Télécharger .ipynb</a>
</div>
<iframe id="f" title="Contenu du projet"></iframe>
<script src="data.js"></script>
<script>try{var t=localStorage.getItem("th");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<script>
const slug=new URLSearchParams(location.search).get("p");
const p=window.PORTFOLIO.projects.find(x=>x.slug===slug);
const f=document.getElementById("f");
if(!p){document.body.innerHTML='<div class="msg">Projet introuvable. <a href="index.html">Retour au portfolio</a></div>'}
else{
  document.title=p.title;
  document.getElementById("ttl").innerHTML=`<small>${p.category}</small>${p.title}`;
  const base="projects/"+p.slug+"/";
  const dl=document.getElementById("dl");dl.href=base+"notebook.ipynb";
  const show=t=>{
    document.getElementById("t-rep").classList.toggle("on",t==="rep");
    document.getElementById("t-nb").classList.toggle("on",t==="nb");
    f.src=base+(t==="rep"?"index.html":"notebook.html");
    history.replaceState(null,"","#"+t);
  };
  document.getElementById("t-rep").onclick=()=>show("rep");
  document.getElementById("t-nb").onclick=()=>show("nb");
  show(location.hash==="#nb"?"nb":"rep");
}
</script>
</body>
</html>
